<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <!-- Dark Slate Rounded Background -->
  <rect width="120" height="120" rx="28" fill="#0B0F17" />
  <rect width="120" height="120" rx="28" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Geometric Minimalist Monogram 'N' (Nutrition & Precision) -->
  <!-- Left Pillar: Clean Emerald Growth Stem -->
  <path 
    d="M34 86 V34" 
    stroke="#10B981" 
    stroke-width="9" 
    stroke-linecap="round" 
  />
  
  <!-- Diagonal Axis: High-Precision Dynamic Transition -->
  <path 
    d="M34 38 L86 82" 
    stroke="url(#nutri-gradient)" 
    stroke-width="9" 
    stroke-linecap="round" 
  />

  <!-- Right Pillar: Energy & Metabolic Flame Ascent -->
  <path 
    d="M86 86 V34" 
    stroke="#F59E0B" 
    stroke-width="9" 
    stroke-linecap="round" 
  />

  <!-- Subtle Center Target Node -->
  <circle cx="60" cy="60" r="4.5" fill="#FFFFFF" />

  <!-- Gradients -->
  <defs>
    <linearGradient id="nutri-gradient" x1="34" y1="38" x2="86" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
</svg>
